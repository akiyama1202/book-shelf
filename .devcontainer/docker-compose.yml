services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/book-shelf
      - claude-code-config:/home/vscode/.claude
    environment:
      HOME: /home/vscode
      DISABLE_AUTOUPDATER: "0"
    command: sleep infinity

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: book_shelf
      MYSQL_USER: book_shelf
      MYSQL_PASSWORD: book_shelf
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../backend:/app
      - backend-venv:/app/.venv
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://book_shelf:book_shelf@mysql:3306/book_shelf
    depends_on:
      mysql:
        condition: service_healthy
    command: bash -c "pip install uv -q && uv sync && uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --reload"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"

volumes:
  claude-code-config:
    name: claude-code-config
  node_modules:
  backend-venv:
  mysql-data:
