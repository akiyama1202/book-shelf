services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/book-shelf
      - claude-code-config:/home/vscode/.claude
    environment:
      HOME: /home/vscode
      DISABLE_AUTOUPDATER: "0"
    command: sleep infinity

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    command: bash -c "pip install uv -q && uv sync && uv run uvicorn app.main:app --host 0.0.0.0 --reload"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"

volumes:
  claude-code-config:
    name: claude-code-config
  node_modules:
