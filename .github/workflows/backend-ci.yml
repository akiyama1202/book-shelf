name: Backend CI

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: amazonlinux:2023
    steps:
      - name: Install system dependencies
        run: dnf install -y git tar gzip

      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    container: amazonlinux:2023
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: book_shelf_test
          MYSQL_USER: book_shelf
          MYSQL_PASSWORD: book_shelf
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: mysql+pymysql://book_shelf:book_shelf@mysql:3306/book_shelf_test
    steps:
      - name: Install system dependencies
        run: dnf install -y git tar gzip

      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest
